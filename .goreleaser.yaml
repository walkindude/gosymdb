version: 2

project_name: gosymdb

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: gosymdb
    flags: ["-trimpath"]
    ldflags:
      - -s -w
      - -X github.com/walkindude/gosymdb/internal/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: gosymdb
    binaries:
      - gosymdb
    repository:
      owner: walkindude
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Casks
    homepage: "https://github.com/walkindude/gosymdb"
    description: "Go symbol and call-graph database backed by SQLite"
    # Strip macOS Gatekeeper's quarantine flag on install, so users don't
    # have to right-click → Open on first run. The CLI is unsigned
    # (no Apple Developer Program subscription), so this is the accepted
    # workaround; users who want signed binaries can compile from source.
    #
    # Homebrew 7.0 deprecated the Ruby `postflight` block that hooks.post.install
    # generates, in favour of the declarative `postflight_steps` stanza
    # (goreleaser/goreleaser#6870, milestoned for v2.19.0). Until goreleaser
    # emits it, custom_block injects the stanza. goreleaser templates the
    # rendered cask, so the braces of Homebrew's {{staged_path}} token are
    # escaped. must_succeed: false because the attribute is absent when the
    # cask is installed with --no-quarantine, and xattr -d then errors.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:         ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/gosymdb"],
              must_succeed: false
        end
      end

nfpms:
  - id: gosymdb
    package_name: gosymdb
    vendor: walkindude
    homepage: "https://github.com/walkindude/gosymdb"
    maintainer: "Stefano Mioli <s@mioli.me>"
    description: "Go symbol and call-graph database backed by SQLite"
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

release:
  prerelease: auto

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: git
  abbrev: 7
  groups:
    - title: "Features"
      regexp: '^feat'
    - title: "Bug Fixes"
      regexp: '^fix'
    - title: "Performance"
      regexp: '^perf'
    - title: "Refactoring"
      regexp: '^refactor'
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^style:"
